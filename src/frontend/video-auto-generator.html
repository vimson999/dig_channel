<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视频合成工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 进度条动画 */
        .progress-bar { transition: width 0.3s ease; }
        .processing-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-5xl mx-auto p-8">
        
        <!-- Header -->
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">🎞️ 视频智能合成</h1>
            <p class="text-slate-500">Video A + (Image + Audio[7s:]) = New Video</p>
        </div>

        <!-- 工作区 -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            
            <form id="uploadForm" class="space-y-8">
                
                <!-- 0. 视频标题 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">视频标题 (可选)</label>
                    <input type="text" name="custom_filename" placeholder="请输入导出文件名 (例如: my_awesome_video)" 
                        class="w-full p-3 border border-slate-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-slate-700">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    
                    <!-- 1. 视频 A (片头) -->
                    <div class="group relative">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Step 1: 片头视频 (Video A)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-blue-500 hover:bg-blue-50 transition-colors cursor-pointer relative h-40 flex flex-col justify-center items-center" id="drop-video">
                            <input type="file" name="video" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewFile(this, 'preview-video-icon', 'preview-video-text')">
                            <i class="fas fa-film text-3xl text-slate-300 mb-2 group-hover:text-blue-500" id="preview-video-icon"></i>
                            <p class="text-xs text-slate-500 truncate px-2 w-full" id="preview-video-text">点击上传片头视频</p>
                        </div>
                    </div>

                    <!-- 2. 插播 C (可选) -->
                    <div class="group relative">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Step 2: 插播片段 (可选)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-2 text-center hover:border-orange-500 hover:bg-orange-50 transition-colors relative h-40 flex flex-col justify-between">
                            
                            <!-- Video C Input -->
                            <div class="relative h-1/2 w-full border-b border-dashed border-slate-200 flex flex-col justify-center items-center cursor-pointer">
                                <input type="file" name="video_c" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewFile(this, 'preview-videoc-icon', 'preview-videoc-text')">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-video text-slate-300 group-hover:text-orange-500" id="preview-videoc-icon"></i>
                                    <span class="text-xs text-slate-500 truncate max-w-[100px]" id="preview-videoc-text">上传插播画面</span>
                                </div>
                            </div>

                            <!-- Audio C Input -->
                            <div class="relative h-1/2 w-full flex flex-col justify-center items-center cursor-pointer">
                                <input type="file" name="audio_c" accept="audio/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewFile(this, 'preview-audioc-icon', 'preview-audioc-text')">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-microphone text-slate-300 group-hover:text-orange-500" id="preview-audioc-icon"></i>
                                    <span class="text-xs text-slate-500 truncate max-w-[100px]" id="preview-audioc-text">上传插播音频</span>
                                </div>
                            </div>
                            
                        </div>
                    </div>

                    <!-- 3. 图片 (Video B 画面) -->
                    <div class="group relative">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Step 3: 正文画面 (Image B)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-purple-500 hover:bg-purple-50 transition-colors cursor-pointer relative h-40 flex flex-col justify-center items-center" id="drop-image">
                            <input type="file" name="image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewFile(this, 'preview-image-icon', 'preview-image-text')">
                            <i class="fas fa-image text-3xl text-slate-300 mb-2 group-hover:text-purple-500" id="preview-image-icon"></i>
                            <p class="text-xs text-slate-500 truncate px-2 w-full" id="preview-image-text">点击上传正文图片</p>
                        </div>
                    </div>

                    <!-- 4. 音频 (Video B 声音) -->
                    <div class="group relative">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Step 4: 正文音频 (Audio B)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-green-500 hover:bg-green-50 transition-colors cursor-pointer relative h-40 flex flex-col justify-center items-center" id="drop-audio">
                            <input type="file" name="audio" accept="audio/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewFile(this, 'preview-audio-icon', 'preview-audio-text')">
                            <i class="fas fa-music text-3xl text-slate-300 mb-2 group-hover:text-green-500" id="preview-audio-icon"></i>
                            <p class="text-xs text-slate-500 truncate px-2 w-full" id="preview-audio-text">点击上传正文音频</p>
                        </div>
                    </div>
                </div>

                <!-- 参数设置 -->
                <div class="bg-slate-50 rounded-lg p-4 grid grid-cols-1 md:grid-cols-2 gap-4 border border-slate-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-scissors text-slate-400"></i>
                            <span class="text-sm font-medium text-slate-700">Step 4 音频截取：从第</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" name="audio_start" value="7" step="0.1" class="w-16 p-1 text-center border border-slate-300 rounded text-sm focus:border-blue-500 focus:outline-none">
                            <span class="text-xs text-slate-500">秒开始</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t md:border-t-0 md:border-l border-slate-200 pt-4 md:pt-0 md:pl-4">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-step-backward text-slate-400"></i>
                            <span class="text-sm font-medium text-slate-700">Step 4 音频截取：末尾去掉</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" name="audio_end_offset" value="10" step="0.1" class="w-16 p-1 text-center border border-slate-300 rounded text-sm focus:border-blue-500 focus:outline-none">
                            <span class="text-xs text-slate-500">秒</span>
                        </div>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <button type="submit" id="submitBtn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span id="btnText">开始合成视频</span>
                    <i class="fas fa-rocket"></i>
                </button>

            </form>

            <!-- 进度状态 -->
            <div id="statusArea" class="hidden mt-8">
                <div class="flex items-center gap-3 mb-2">
                    <div class="animate-spin w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                    <span class="text-sm font-medium text-blue-600">正在处理中，这可能需要几分钟... (请勿关闭页面)</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div class="bg-blue-500 h-2 w-full animate-pulse"></div>
                </div>
            </div>

            <!-- 结果展示 -->
            <div id="resultArea" class="hidden mt-8 border-t border-slate-100 pt-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-center">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-check text-2xl text-green-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-green-800 mb-2">合成成功！</h3>
                    <p class="text-green-600 mb-6 text-sm">您的视频已准备就绪。</p>
                    
                    <a id="downloadLink" href="#" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md transition-colors">
                        <i class="fas fa-download"></i>
                        下载视频
                    </a>
                </div>
            </div>

            <!-- 错误提示 -->
            <div id="errorArea" class="hidden mt-8 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 flex items-start gap-3">
                <i class="fas fa-exclamation-circle mt-1"></i>
                <div>
                    <p class="font-bold">发生错误</p>
                    <p id="errorText" class="text-sm opacity-90"></p>
                </div>
            </div>

        </div>
    </div>

    <!-- 脚本 -->
    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20261004-navigation-2"></script>
    <script>
        // 文件预览逻辑
        function previewFile(input, iconId, textId) {
            const file = input.files[0];
            if (file) {
                document.getElementById(iconId).classList.replace('text-slate-300', 'text-blue-500');
                document.getElementById(textId).textContent = file.name;
                document.getElementById(textId).classList.add('text-blue-600', 'font-medium');
            }
        }

        // 表单提交
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const statusArea = document.getElementById('statusArea');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');
            const downloadLink = document.getElementById('downloadLink');

            // 基础校验
            const video = form.video.files[0];
            const image = form.image.files[0];
            const audio = form.audio.files[0];
            
            // C 部分校验 (选填，但必须成对)
            const videoC = form.video_c.files[0];
            const audioC = form.audio_c.files[0];

            if (!video || !image || !audio) {
                alert('请上传 Step 1 (片头), Step 3 (正文画面), Step 4 (正文音频) 的必要文件');
                return;
            }
            
            if (!videoC && audioC) {
                alert('Step 2 (插播片段) 如果上传了音频，必须同时也上传视频画面');
                return;
            }

            // UI 状态更新
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = '合成中...';
            statusArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');

            const formData = new FormData(form);

            try {
                // 使用 window.API_BASE_URL (由 env.js 提供)
                const apiUrl = `${window.API_BASE_URL || '/api/v1'}/video-editor/synthesize`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '合成失败');
                }

                // 成功：重新构建完整的下载链接
                // window.API_BASE_URL 通常是 http://localhost:5001/api/v1
                const fullDownloadUrl = `${window.API_BASE_URL || '/api/v1'}/video-editor/download/${data.filename}`;
                
                downloadLink.href = fullDownloadUrl;
                resultArea.classList.remove('hidden');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorText').textContent = error.message;
                errorArea.classList.remove('hidden');
            } finally {
                // 恢复按钮
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = '开始合成视频';
                statusArea.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
