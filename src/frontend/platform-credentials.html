<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台凭据管理 | Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#111827',
                        muted: '#64748b',
                        line: '#dbe3ef',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="max-w-[1440px] mx-auto px-6 py-8">
        <section class="mb-6">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                <div>
                    <h2 class="text-2xl font-black tracking-tight text-slate-950">平台凭据管理</h2>
                    <p class="mt-1 text-sm text-slate-500">Cookie、Token、发布账号凭据统一加密保存。</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="import-bili-btn" class="rounded-lg border border-sky-200 bg-sky-50 px-3 py-2 text-sm font-bold text-sky-700 hover:bg-sky-100">
                        <i class="fab fa-bilibili mr-2"></i>导入 B站配置
                    </button>
                    <button id="import-zsxq-btn" class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-bold text-emerald-700 hover:bg-emerald-100">
                        <i class="fas fa-circle-nodes mr-2"></i>导入星球发帖账号池
                    </button>
                    <button id="new-account-btn" class="rounded-lg bg-slate-950 px-3 py-2 text-sm font-bold text-white hover:bg-slate-800">
                        <i class="fas fa-plus mr-2"></i>新增凭据
                    </button>
                </div>
            </div>
            <div id="page-message" class="mt-4 hidden rounded-lg border px-4 py-3 text-sm"></div>
        </section>

        <section class="grid grid-cols-1 gap-5 xl:grid-cols-[360px_1fr]">
            <aside class="space-y-5">
                <section class="rounded-xl border border-line bg-white p-5 shadow-sm">
                    <h3 class="text-sm font-black text-slate-900">筛选</h3>
                    <div class="mt-4 space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-500">平台</label>
                            <div id="platform-tabs" class="mt-2 grid grid-cols-2 gap-2"></div>
                        </div>
                        <div>
                            <label for="purpose-filter" class="text-xs font-bold text-slate-500">用途</label>
                            <select id="purpose-filter" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold outline-none focus:border-slate-900">
                                <option value="">全部用途</option>
                            </select>
                        </div>
                        <div>
                            <label for="status-filter" class="text-xs font-bold text-slate-500">状态</label>
                            <select id="status-filter" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold outline-none focus:border-slate-900">
                                <option value="">非删除</option>
                            </select>
                        </div>
                        <div>
                            <label for="keyword-input" class="text-xs font-bold text-slate-500">搜索</label>
                            <div class="mt-1 flex gap-2">
                                <input id="keyword-input" class="min-w-0 flex-1 rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none focus:border-slate-900" placeholder="名称 / 摘要 / 备注">
                                <button id="search-btn" class="h-10 w-10 rounded-lg border border-line bg-white text-slate-600 hover:bg-slate-50" title="搜索">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="rounded-xl border border-line bg-white p-5 shadow-sm">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-black text-slate-900">凭据表单</h3>
                        <span id="form-mode-badge" class="rounded-full bg-slate-100 px-2 py-1 text-[11px] font-black text-slate-500">新增</span>
                    </div>
                    <form id="credential-form" class="mt-4 space-y-4">
                        <input id="account-id-input" type="hidden">
                        <div>
                            <label class="text-xs font-bold text-slate-500">平台</label>
                            <select id="platform-input" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold outline-none focus:border-slate-900" required></select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">凭据类型</label>
                            <select id="credential-type-input" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold outline-none focus:border-slate-900"></select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">名称</label>
                            <input id="name-input" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none focus:border-slate-900" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">用途授权</label>
                            <div id="purpose-checkboxes" class="mt-2 grid grid-cols-1 gap-2"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-bold text-slate-500">状态</label>
                                <select id="status-input" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold outline-none focus:border-slate-900"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500">优先级</label>
                                <input id="priority-input" type="number" value="100" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none focus:border-slate-900">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">账号标识</label>
                            <input id="owner-label-input" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none focus:border-slate-900" placeholder="例如：主账号 / 发布小号">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">Cookie / Token / JSON</label>
                            <textarea id="payload-input" rows="6" class="mt-1 w-full rounded-lg border border-line bg-slate-50 px-3 py-2 font-mono text-xs outline-none focus:border-slate-900" placeholder="编辑已有凭据时，留空表示不替换密文"></textarea>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">备注</label>
                            <textarea id="notes-input" rows="3" class="mt-1 w-full rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none focus:border-slate-900"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <button id="save-btn" type="submit" class="rounded-lg bg-slate-950 px-3 py-2 text-sm font-bold text-white hover:bg-slate-800">
                                <i class="fas fa-floppy-disk mr-2"></i>保存
                            </button>
                            <button id="reset-btn" type="button" class="rounded-lg border border-line bg-white px-3 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                                <i class="fas fa-rotate-left mr-2"></i>重置
                            </button>
                        </div>
                    </form>
                </section>
            </aside>

            <section class="rounded-xl border border-line bg-white shadow-sm">
                <div class="flex flex-col gap-3 border-b border-line p-5 lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <h3 class="text-base font-black text-slate-950">凭据列表</h3>
                        <p id="list-summary" class="mt-1 text-sm text-slate-500">正在加载...</p>
                    </div>
                    <button id="refresh-btn" class="rounded-lg border border-line bg-white px-3 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                        <i class="fas fa-rotate mr-2"></i>刷新
                    </button>
                </div>
                <div id="credential-list" class="grid grid-cols-1 gap-3 p-5 2xl:grid-cols-2"></div>
                <div class="flex items-center justify-between border-t border-line p-5">
                    <button id="prev-page-btn" class="rounded-lg border border-line bg-white px-3 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                        <i class="fas fa-chevron-left mr-2"></i>上一页
                    </button>
                    <span id="page-indicator" class="text-sm font-bold text-slate-500">第 1 页</span>
                    <button id="next-page-btn" class="rounded-lg border border-line bg-white px-3 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                        下一页<i class="fas fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </section>
        </section>
    </main>

    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/shared-navigation.js"></script>
    <script src="js/platform-credentials.js?v=20260620-platform-credentials"></script>
</body>
</html>
