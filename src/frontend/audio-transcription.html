<!doctype html>
<!-- 通用音频转文字工作台：上传一段音频，恢复持久化任务并预览两个结果。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音频转文字 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<main class="max-w-6xl mx-auto px-5 py-8 space-y-6">
    <header><h1 class="text-2xl font-bold">音频转文字</h1><p class="text-slate-500 mt-2">上传一段中文音频，同时获取纯文本与 SRT 字幕。</p></header>
    <p id="notice" role="status" aria-live="polite" class="text-sm text-indigo-700"></p>
    <div class="grid gap-6 lg:grid-cols-[340px_1fr]">
        <form id="upload-form" class="bg-white border rounded-2xl p-6 space-y-5 self-start">
            <label id="drop-zone" class="block border-2 border-dashed rounded-xl p-6 text-center cursor-pointer hover:border-indigo-400">
                <i class="fas fa-file-audio text-3xl text-indigo-500 mb-3" aria-hidden="true"></i>
                <span class="block font-semibold">选择或拖入一个音频</span>
                <span id="upload-limit" class="block text-xs text-slate-500 mt-2">最大 2 GB · MP3 / M4A / WAV / AAC / FLAC / OGG / OPUS</span>
                <input id="audio-file" type="file" accept=".mp3,.m4a,.wav,.aac,.flac,.ogg,.opus" class="block text-xs w-full mt-4">
            </label>
            <p id="file-info" class="text-sm text-slate-600 break-all">尚未选择音频</p>
            <details><summary class="text-sm cursor-pointer text-slate-600">识别提示词（可选）</summary>
                <label for="prompt" class="block text-xs text-slate-500 mt-3">可填写人名、产品名等参考词语</label>
                <textarea id="prompt" maxlength="1000" rows="3" class="mt-2 border rounded-lg w-full p-2 text-sm"></textarea>
            </details>
            <button id="submit" class="w-full bg-indigo-600 text-white rounded-lg px-4 py-3 font-semibold disabled:opacity-50">开始转写</button>
            <progress id="upload-progress" max="100" value="0" class="w-full hidden" aria-label="上传进度"></progress>
        </form>
        <section class="bg-white border rounded-2xl p-6 min-w-0">
            <h2 id="job-title" class="font-bold text-lg break-all">转写结果</h2>
            <p id="job-state" role="status" class="text-sm text-slate-500 mt-2">提交音频后，结果会显示在这里。</p>
            <button id="retry" type="button" hidden class="mt-3 border rounded-lg px-4 py-2 text-sm">重试任务</button>
            <div id="results" hidden class="mt-5">
                <div class="flex gap-2 flex-wrap items-center">
                    <button id="text-tab" type="button" aria-pressed="true" class="border rounded-lg px-3 py-2 text-sm">纯文本</button>
                    <button id="srt-tab" type="button" aria-pressed="false" class="border rounded-lg px-3 py-2 text-sm">SRT 字幕</button>
                    <button id="copy" type="button" class="ml-auto text-indigo-700 text-sm">复制</button>
                    <a id="download" class="text-indigo-700 text-sm" download>下载</a>
                </div>
                <textarea id="output" readonly aria-label="转写内容" class="w-full mt-4 border rounded-lg p-4 text-sm leading-7 h-96 resize-y"></textarea>
            </div>
        </section>
    </div>
    <section class="bg-white border rounded-2xl p-6">
        <div class="flex justify-between items-center"><h2 class="font-bold">最近任务</h2><button id="refresh" type="button" class="text-sm text-indigo-700">刷新</button></div>
        <div id="history" class="mt-4 divide-y text-sm"></div>
        <div class="flex justify-end gap-4 mt-4 text-sm"><button id="previous" type="button">上一页</button><span id="page-label">1</span><button id="next" type="button">下一页</button></div>
    </section>
</main>
<script src="js/env.js"></script>
<script src="js/shared-navigation.js"></script>
<script src="js/audio-transcription.js?v=20260914"></script>
</body>
</html>
