<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI 测试台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
                            800: '#1e40af', 900: '#1e3a8a'
                        }
                    },
                    borderRadius: { 'button': '8px' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

    <div class="max-w-[1440px] mx-auto px-6 py-4 mt-4">
        <nav class="flex items-center gap-2 text-sm text-gray-500">
            <a href="/" class="hover:text-primary-600 transition-colors"><i class="fas fa-home"></i> 首页</a>
            <span class="mx-2">/</span>
            <span class="text-gray-700 font-medium">Gemini 测试台</span>
        </nav>
    </div>

    <main class="max-w-[1000px] mx-auto px-6 py-8">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="h-2 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
            
            <div class="p-8">
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-robot text-white text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-extrabold text-gray-800">Gemini AI 实验室</h2>
                        <p class="text-gray-500">基于 Google 官方模型接口</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">输入提示词 (Prompt)</label>
                            <textarea id="prompt_input" rows="5" 
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-primary-100 focus:border-primary-500 outline-none transition-all text-gray-700"
                                placeholder="请输入您的问题或指令..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">选择可用模型</label>
                            <select id="model_select" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-primary-100 focus:border-primary-500 outline-none bg-white shadow-sm">
                                <option value="gemini-2.0-flash">正在加载模型...</option>
                            </select>
                            <div class="mt-4 p-4 bg-amber-50 rounded-xl border border-amber-100 text-[11px] text-amber-800">
                                <p class="font-bold mb-1"><i class="fas fa-lightbulb mr-1"></i> 提示：</p>
                                <p>如果列表中没有出现模型，请检查后端服务是否启动，并确保 .env 中配置了正确的 Key。</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <button id="submit_btn" onclick="startGeneration()" class="px-8 py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-button shadow-lg flex items-center gap-2 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-paper-plane"></i>
                            <span>发送请求</span>
                        </button>
                        
                        <div id="loading_spinner" class="hidden items-center gap-2 text-primary-600 font-medium">
                            <i class="fas fa-spinner fa-spin"></i>
                            <span>AI 正在响应中...</span>
                        </div>
                    </div>

                    <div id="result_box" class="hidden space-y-2 animate-in slide-in-from-bottom-2 duration-500">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-semibold text-emerald-600 flex items-center gap-2">
                                <i class="fas fa-sparkles"></i> AI 生成结果：
                            </span>
                            <button onclick="copyResult()" class="text-xs text-gray-400 hover:text-primary-600">
                                <i class="far fa-copy mr-1"></i> 复制
                            </button>
                        </div>
                        <div id="result_text" class="p-6 bg-slate-50 rounded-2xl border border-slate-200 text-gray-800 whitespace-pre-wrap min-h-[100px] shadow-inner"></div>
                    </div>

                    <div id="error_box" class="hidden p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 flex items-start gap-3">
                        <i class="fas fa-exclamation-circle mt-1"></i>
                        <div>
                            <p class="font-bold">发生错误</p>
                            <p id="error_text" class="text-xs"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 通用脚本加载 -->
    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js"></script>
    <script>
        // 初始化
        window.onload = function() {
            console.log('✅ Page Init. API URL:', window.API_BASE_URL);
            fetchModels();
        };

        async function fetchModels() {
            const select = document.getElementById('model_select');
            try {
                const res = await fetch(`${window.API_BASE_URL}/gemini/models`);
                const data = await res.json();
                if (data.models && data.models.length > 0) {
                    select.innerHTML = '';
                    data.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name; // Simplified for clarity
                        if (m.name === 'gemini-2.0-flash') opt.selected = true;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="gemini-2.0-flash">暂无可用模型</option>';
                }
            } catch (err) {
                console.error('Fetch models failed:', err);
                select.innerHTML = '<option value="gemini-2.0-flash">加载失败 (使用默认)</option>';
            }
        }

        async function startGeneration() {
            const prompt = document.getElementById('prompt_input').value.trim();
            const model = document.getElementById('model_select').value;
            const btn = document.getElementById('submit_btn');
            const loading = document.getElementById('loading_spinner');
            const resultBox = document.getElementById('result_box');
            const errorBox = document.getElementById('error_box');

            if (!prompt) {
                alert('请输入内容！');
                return;
            }

            // Reset UI
            btn.disabled = true;
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const response = await fetch(`${window.API_BASE_URL}/gemini/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, model })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'API 返回错误');

                document.getElementById('result_text').textContent = data.result;
                resultBox.classList.remove('hidden');
            } catch (error) {
                console.error('Request failed:', error);
                document.getElementById('error_text').textContent = error.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function copyResult() {
            const text = document.getElementById('result_text').textContent;
            navigator.clipboard.writeText(text).then(() => alert('已复制'));
        }
    </script>
</body>
</html>
