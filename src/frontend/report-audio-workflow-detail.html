<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研报转语音详情 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            display: inline-block;
        }
        .platform-publish-tab-body [data-publish-platform-panel] > div > section {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div id="nav-container"></div>

    <main class="mx-auto max-w-[1536px] px-4 py-6 sm:px-6">
        <div class="mb-5 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <div class="mb-2 flex flex-wrap items-center gap-2 text-xs font-bold text-slate-500">
                    <a href="report-audio-workflow-test.html" class="text-indigo-700 hover:text-indigo-900">
                        <i class="fas fa-arrow-left mr-1"></i>返回编排台
                    </a>
                    <span id="job-id-label"></span>
                </div>
                <h1 id="detail-title" class="text-2xl font-black tracking-tight">研报转语音详情</h1>
                <p id="detail-subtitle" class="mt-1 text-sm text-slate-500">加载任务详情中。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button id="refresh-detail-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-1.5"></i>刷新详情
                </button>
                <a id="open-api-json" href="#" target="_blank" rel="noopener noreferrer" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-code mr-1.5"></i>API JSON
                </a>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"></div>
        <div class="lg:grid lg:grid-cols-[11rem_minmax(0,1fr)] lg:items-start lg:gap-5">
            <aside id="quick-nav" class="hidden lg:sticky lg:top-24 lg:block" aria-label="详情快速导航">
                <nav class="max-h-[calc(100vh-7rem)] overflow-y-auto rounded-xl border border-slate-200 bg-white p-2 shadow-sm">
                    <div class="px-3 pb-2 pt-1 text-[11px] font-black uppercase tracking-wider text-slate-400">快速导航</div>
                    <button data-quick-nav="task-overview" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-list-check w-4 text-center"></i><span>任务概览</span></button>
                    <button data-quick-nav="production-tools" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-wand-magic-sparkles w-4 text-center"></i><span>成片生成</span></button>
                    <button data-quick-nav="visual-videos" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-photo-film w-4 text-center"></i><span>视觉方案</span></button>
                    <button data-quick-nav="media-assets" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-play w-4 text-center"></i><span>素材预览</span></button>
                    <button data-quick-nav="content-results" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-file-lines w-4 text-center"></i><span>文案内容</span></button>
                    <button data-quick-nav="pdf-evidence-panel" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-file-shield w-4 text-center"></i><span>PDF 证据</span></button>
                    <button data-quick-nav="child-tasks" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-diagram-project w-4 text-center"></i><span>子任务</span></button>
                    <button data-quick-nav="publish-center" class="quick-nav-item flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-xs font-bold text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"><i class="fas fa-share-nodes w-4 text-center"></i><span>发布投递</span></button>
                    <div id="sidebar-task-status" class="mt-2 border-t border-slate-100 px-2 pt-3" aria-live="polite">
                        <div class="rounded-lg bg-slate-50 px-2.5 py-3 text-[11px] text-slate-400">任务状态加载中...</div>
                    </div>
                    <button id="sidebar-refresh-btn" type="button" class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-3 py-2.5 text-xs font-black text-white shadow-sm transition hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-60">
                        <i class="fas fa-rotate"></i><span>刷新详情</span>
                    </button>
                    <button data-scroll-top class="mt-2 flex w-full items-center justify-center gap-2 border-t border-slate-100 px-3 pt-3 text-[11px] font-bold text-slate-400 hover:text-indigo-700"><i class="fas fa-arrow-up"></i>回到顶部</button>
                </nav>
            </aside>
            <div id="detail-root" class="min-w-0 space-y-4"></div>
        </div>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20261004-navigation-2"></script>
    <script src="js/upload-success-sound.js?v=20260905-upload-success-sound"></script>
    <script src="js/bilibili-publish-panel.js?v=20260905-upload-sound-consumer"></script>
    <script src="js/platform-browser-publish-panel.js?v=20260905-upload-sound-consumer"></script>
    <script src="js/browser-human-intervention.js?v=20260812-v1"></script>
    <script src="js/report-audio-workflow-detail.js?v=20260812-human-intervention-v1"></script>
    <script src="js/report-pdf-evidence-panel.js?v=20260809-evidence-disabled-v1"></script>
</body>
</html>
