<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celery 控制台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .celery-service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(292px, 1fr));
            gap: 16px;
            align-items: stretch;
        }

        .celery-service-card {
            min-width: 0;
        }

        .celery-service-desc {
            min-height: 34px;
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        @media (max-width: 720px) {
            .celery-service-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-[1440px] px-6 py-6">
        <div class="mb-5 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight">Celery 控制台</h1>
                <p class="mt-1 text-sm text-slate-500">监控和控制本地开发环境的 Celery Worker。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="broker-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">Broker 检查中</span>
                <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-2"></i>刷新
                </button>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"></div>

        <section id="watchdog-card" class="mb-5"></section>

        <section id="service-grid" class="space-y-5"></section>

        <section class="mt-5 grid grid-cols-1 gap-4 lg:grid-cols-[320px_minmax(0,1fr)]">
            <div class="rounded-lg border border-slate-200 bg-white p-4">
                <div class="mb-3 flex items-center justify-between">
                    <h2 class="text-sm font-black uppercase tracking-wide text-slate-500">Worker 列表</h2>
                    <span id="last-updated" class="text-xs text-slate-400">-</span>
                </div>
                <div id="service-list" class="space-y-2"></div>
            </div>

            <div class="min-w-0 rounded-lg border border-slate-200 bg-white">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
                    <div class="min-w-0">
                        <h2 id="log-title" class="truncate text-base font-black">运行日志</h2>
                        <p id="log-subtitle" class="mt-1 truncate text-xs text-slate-500">选择一个 worker 查看日志。</p>
                    </div>
                    <button id="refresh-log-btn" class="rounded-lg border border-slate-300 px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50">
                        <i class="fas fa-file-lines mr-2"></i>刷新日志
                    </button>
                </div>
                <pre id="log-output" class="min-h-[420px] max-h-[560px] overflow-auto whitespace-pre-wrap bg-slate-950 p-4 text-xs leading-5 text-slate-200">等待日志...</pre>
            </div>
        </section>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20260602-celery"></script>
    <script src="js/celery-monitor.js?v=20260613-watchdog-timeout"></script>
</body>
</html>
