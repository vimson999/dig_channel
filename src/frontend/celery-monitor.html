<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celery 控制台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/celery-monitor.css?v=20261003">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="celery-console mx-auto max-w-[1440px] px-6 py-6">
        <div class="mb-5 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight">Celery 控制台</h1>
                <p class="mt-1 text-sm text-slate-500">查看队列健康状况，定位异常并管理本地 Worker。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="broker-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">Broker 检查中</span>
                <a href="#logs-section" class="monitor-button"><i class="fas fa-file-lines" aria-hidden="true"></i>运行日志</a>
                <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-2"></i>刷新
                </button>
            </div>
        </div>

        <div class="monitor-refresh-bar">
            <span id="last-updated" role="status">尚未获取状态</span>
            <div class="monitor-refresh-controls">
                <span id="polling-status">状态每 15 秒刷新</span>
                <button id="toggle-polling-btn" class="monitor-text-button" aria-pressed="false">暂停自动刷新</button>
                <button id="inspect-btn" class="monitor-text-button" title="按需查询 Worker 已领取的任务，可能需要约 30 秒">检查实时任务</button>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm" role="status" aria-live="polite"></div>

        <section id="status-summary" class="monitor-summary" aria-label="Worker 状态总览"></section>

        <section id="watchdog-card" class="mb-5"></section>

        <section class="monitor-toolbar" aria-label="筛选 Worker">
            <div class="monitor-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <label class="sr-only" for="service-search">搜索 Worker 名称或队列</label>
                <input id="service-search" type="search" placeholder="搜索 Worker 名称或队列…" autocomplete="off">
            </div>
            <div id="service-filters" class="monitor-filters" role="group" aria-label="状态筛选">
                <button data-filter="all" aria-pressed="true">全部</button>
                <button data-filter="attention" aria-pressed="false">需关注</button>
                <button data-filter="backlog" aria-pressed="false">有积压</button>
                <button data-filter="paused" aria-pressed="false">已暂停</button>
                <button data-filter="offline" aria-pressed="false">离线</button>
            </div>
            <span id="filter-count" class="text-xs text-slate-500" role="status"></span>
            <button id="restart-all-btn" class="monitor-text-button monitor-danger" disabled><i class="fas fa-power-off" aria-hidden="true"></i>重启全部</button>
        </section>

        <section id="service-grid" class="space-y-5" aria-label="Worker 队列" aria-busy="true">
            <div class="monitor-empty" role="status">正在获取 Worker 状态…</div>
        </section>

        <section id="logs-section" class="monitor-logs mt-5 grid grid-cols-1 gap-4 lg:grid-cols-[280px_minmax(0,1fr)]" aria-label="运行日志">
            <div class="rounded-lg border border-slate-200 bg-white p-4">
                <div class="mb-3 flex items-center justify-between">
                    <h2 class="text-sm font-black uppercase tracking-wide text-slate-500">Worker 列表</h2>
                    <span class="text-xs text-slate-400">选择查看日志</span>
                </div>
                <div id="service-list" class="space-y-2"></div>
            </div>

            <div class="min-w-0 rounded-lg border border-slate-200 bg-white">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
                    <div class="min-w-0">
                        <h2 id="log-title" class="truncate text-base font-black" tabindex="-1">运行日志</h2>
                        <p id="log-subtitle" class="mt-1 truncate text-xs text-slate-500">选择一个 worker 查看日志。</p>
                    </div>
                    <div class="monitor-log-controls">
                        <label for="log-lines" class="sr-only">日志行数</label>
                        <select id="log-lines" class="monitor-select"><option value="160">最近 160 行</option><option value="400">最近 400 行</option><option value="800">最近 800 行</option></select>
                        <label class="flex items-center gap-1.5 text-xs text-slate-500"><input id="log-follow" type="checkbox" checked>滚动到底部</label>
                        <button id="refresh-log-btn" disabled class="rounded-lg border border-slate-300 px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50">
                            <i class="fas fa-file-lines mr-2" aria-hidden="true"></i>刷新日志
                        </button>
                    </div>
                </div>
                <pre id="log-output" tabindex="0" aria-label="Worker 日志内容" class="min-h-[420px] max-h-[560px] overflow-auto whitespace-pre-wrap bg-slate-950 p-4 text-xs leading-5 text-slate-200">等待日志...</pre>
            </div>
        </section>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20261004-navigation-2"></script>
    <script src="js/visibility-polling.js?v=20260816-db-polling-guard"></script>
    <script src="js/celery-monitor.js?v=20261003"></script>
</body>
</html>
