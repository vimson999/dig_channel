<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频管理 - YouTube Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: {
50: '#eff6ff',
100: '#dbeafe', 
200: '#bfdbfe',
300: '#93c5fd',
400: '#60a5fa',
500: '#3b82f6',
600: '#2563eb',
700: '#1d4ed8',
800: '#1e40af',
900: '#1e3a8a'
},
secondary: '#64748b',
accent: {
green: '#10b981',
purple: '#8b5cf6',
orange: '#f59e0b',
red: '#ef4444',
blue: '#06b6d4'
},
success: '#10b981',
warning: '#f59e0b',
danger: '#ef4444',
info: '#06b6d4'
},
borderRadius: {
'button': '8px'
},
fontFamily: {
'sans': ['Inter', 'ui-sans-serif', 'system-ui']
},
boxShadow: {
'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
'medium': '0 4px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 20px -5px rgba(0, 0, 0, 0.04)',
'strong': '0 10px 40px -10px rgba(0, 0, 0, 0.1), 0 2px 10px -2px rgba(0, 0, 0, 0.04)'
}
}
}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
min-height: 1024px;
}
.toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 9999; }
.status-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
.video-thumbnail {
    width: 120px;
    height: 68px;
    object-fit: cover;
}
.video-duration {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 1px 4px;
    border-radius: 2px;
    font-size: 10px;
}
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen font-sans">
    <!-- 状态提示栏 -->
    <div id="status-bar" class="hidden status-bar bg-blue-500 text-white p-3 text-center">
        <div class="flex items-center justify-center">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
            <span id="status-text">正在加载...</span>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toast-container" class="toast-container space-y-2"></div>

    <!-- 主导航栏 -->
    <header class="bg-white/80 backdrop-blur-lg border-b border-gray-200/50 sticky top-0 z-40">
        <div class="max-w-[1440px] mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo 和标题 -->
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fab fa-youtube text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">YouTube Analytics</h1>
                        <p class="text-sm text-gray-500">视频管理中心</p>
                    </div>
                </div>
                
                <!-- 导航菜单 -->
                <nav class="hidden md:flex items-center gap-6">
                    <a href="index.html" class="nav-link text-gray-600 hover:text-primary-600 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-chart-line mr-2"></i>首页
                    </a>
                    <a href="index.html#channels" class="nav-link text-gray-600 hover:text-primary-600 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-tv mr-2"></i>频道管理
                    </a>
                    <a href="videos.html" class="nav-link text-primary-600 font-medium px-3 py-2 rounded-lg bg-primary-50 border border-primary-200">
                        <i class="fas fa-play mr-2"></i>视频管理
                    </a>
                </nav>
                
                <!-- 移动端菜单按钮 -->
                <button class="md:hidden p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                
                <!-- 用户操作区 -->
                <div class="flex items-center gap-3">
                    <button class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" title="设置">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" title="帮助">
                        <i class="fas fa-question-circle"></i>
                    </button>
                    
                    <!-- 用户下拉菜单 -->
                    <div class="relative group">
                        <button class="flex items-center gap-2 p-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                            <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-sm font-medium user-avatar">U</span>
                            </div>
                            <span class="hidden md:block text-sm font-medium user-name">用户</span>
                            <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                        </button>
                        
                        <!-- 下拉菜单 -->
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-all duration-200 z-50">
                            <div class="py-2">
                                <div class="px-4 py-2 border-b border-gray-100">
                                    <p class="text-sm font-medium text-gray-900 user-name">用户</p>
                                    <p class="text-xs text-gray-500">管理员</p>
                                </div>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                                    <i class="fas fa-user mr-2"></i>个人资料
                                </a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                                    <i class="fas fa-cog mr-2"></i>账户设置
                                </a>
                                <hr class="my-1">
                                <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                    <i class="fas fa-sign-out-alt mr-2"></i>退出登录
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 面包屑导航 -->
    <div class="max-w-[1440px] mx-auto px-6 py-4">
        <nav class="flex items-center gap-2 text-sm text-gray-500">
            <a href="index.html" class="hover:text-primary-600 transition-colors">
                <i class="fas fa-home"></i>
            </a>
            <span class="mx-2">/</span>
            <span class="text-gray-700">视频管理</span>
        </nav>
    </div>

    <!-- 主内容区域 -->
    <main class="max-w-[1440px] mx-auto px-6 pb-8">



        <!-- 视频列表 -->
        <div class="bg-white rounded-xl shadow-medium border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <!-- 搜索和功能区域 -->
                <div class="flex flex-col lg:flex-row items-center gap-4">
                    <!-- 搜索框 -->
                    <div class="flex-1 min-w-0">
                        <div class="relative">
                            <input type="text" id="search-videos" placeholder="搜索视频标题、描述或标签..." 
                                   class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-button focus:border-primary-500 focus:ring-2 focus:ring-primary-200 focus:outline-none transition-all">
                            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                    
                    <!-- 筛选和操作区域 -->
                    <div class="flex items-center gap-2">
                        <select id="filter-channel" class="px-3 py-3 border border-gray-300 rounded-button focus:border-primary-500 focus:ring-2 focus:ring-primary-200 focus:outline-none text-sm">
                            <option value="">所有频道</option>
                        </select>
                        
                        <select id="filter-category" class="px-3 py-3 border border-gray-300 rounded-button focus:border-primary-500 focus:ring-2 focus:ring-primary-200 focus:outline-none text-sm">
                            <option value="">所有分类</option>
                        </select>
                        
                        <select id="sort-by" class="px-3 py-3 border border-gray-300 rounded-button focus:border-primary-500 focus:ring-2 focus:ring-primary-200 focus:outline-none text-sm">
                            <option value="published_at:desc">最新发布</option>
                            <option value="published_at:asc">最早发布</option>
                            <option value="view_count:desc">播放量最高</option>
                            <option value="view_count:asc">播放量最低</option>
                            <option value="like_count:desc">点赞最多</option>
                            <option value="comment_count:desc">评论最多</option>
                        </select>
                        
                        <button onclick="clearFilters()" class="px-3 py-3 text-gray-600 hover:text-gray-800 border border-gray-300 rounded-button hover:bg-gray-50 transition-colors" title="清除筛选">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <button onclick="refreshVideos()" class="px-3 py-3 text-gray-600 hover:text-primary-600 hover:bg-primary-50 rounded-button transition-colors" title="刷新列表">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        
                        <button onclick="syncAllVideos()" class="flex items-center gap-2 bg-gradient-to-r from-green-500 to-green-600 text-white px-3 py-3 rounded-button font-medium shadow-lg hover:from-green-600 hover:to-green-700 hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 text-sm">
                            <i class="fas fa-sync-alt text-xs"></i>
                            同步
                        </button>
                        
                        <button onclick="cleanShortVideos()" class="flex items-center gap-2 bg-gradient-to-r from-red-500 to-red-600 text-white px-3 py-3 rounded-button font-medium shadow-lg hover:from-red-600 hover:to-red-700 hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 text-sm">
                            <i class="fas fa-trash text-xs"></i>
                            清理短视频
                        </button>
                        
                        <div class="text-sm text-gray-500 ml-2">
                            共 <span id="videos-count">0</span> 个
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 视频卡片网格 -->
            <div id="videos-grid" class="p-6">
                <!-- 加载状态 -->
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600 mb-4"></div>
                    <p class="text-gray-500">正在加载视频数据...</p>
                </div>
            </div>
            
            <!-- 分页 -->
            <div id="pagination" class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex items-center justify-between">
                <div class="text-sm text-gray-500">
                    显示第 <span id="page-start">1</span> - <span id="page-end">20</span> 条，共 <span id="total-records">0</span> 条记录
                </div>
                <div class="flex items-center gap-2">
                    <button id="prev-page" onclick="changePage(-1)" disabled class="px-3 py-2 border border-gray-300 rounded-button text-sm text-gray-500 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left mr-1"></i>上一页
                    </button>
                    <div id="page-numbers" class="flex items-center gap-1">
                        <!-- 页码按钮将在这里动态生成 -->
                    </div>
                    <button id="next-page" onclick="changePage(1)" disabled class="px-3 py-2 border border-gray-300 rounded-button text-sm text-gray-500 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                        下一页 <i class="fas fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 视频详情模态框 -->
    <div id="videoDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-strong max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto transform transition-all duration-300 scale-95 opacity-0" id="videoModalContent">
            <div class="p-6 border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <i class="fas fa-play text-white"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">视频详情</h3>
                            <p class="text-sm text-gray-600">查看视频详细信息和数据</p>
                        </div>
                    </div>
                    <button onclick="closeVideoDetailModal()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>
            </div>
            
            <div id="video-detail-content" class="p-6">
                <!-- 视频详情内容将在这里动态加载 -->
            </div>
        </div>
    </div>

    <!-- 同步视频模态框 -->
    <div id="syncVideoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-strong max-w-lg w-full mx-4 transform transition-all duration-300 scale-95 opacity-0" id="syncModalContent">
            <div class="p-6 border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-green-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sync-alt text-white"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">同步视频数据</h3>
                        <p class="text-sm text-gray-600">从YouTube获取最新的视频数据</p>
                    </div>
                </div>
            </div>
            
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">回溯天数</label>
                    <select id="sync-days-back" class="w-full px-3 py-2 border border-gray-300 rounded-button focus:border-primary-500 focus:ring-2 focus:ring-primary-200 focus:outline-none">
                        <option value="3">最近 3 天</option>
                        <option value="7">最近 7 天</option>
                        <option value="10" selected>最近 10 天</option>
                        <option value="15">最近 15 天</option>
                        <option value="30">最近 30 天</option>
                    </select>
                    <p class="text-sm text-gray-500 mt-1">选择同步多少天内发布的视频</p>
                </div>
                
                <div id="sync-progress" class="hidden mb-4">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-green-600"></div>
                        <span class="text-sm text-gray-600">正在同步视频数据...</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="sync-progress-bar" class="bg-green-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                
                <div id="sync-result" class="hidden"></div>
            </div>
            
            <div class="p-6 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3">
                <button onclick="closeSyncVideoModal()" class="px-5 py-2.5 text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-button font-medium transition-all duration-200">取消</button>
                <button id="start-sync-btn" onclick="startVideoSync()" class="px-5 py-2.5 bg-gradient-to-r from-green-500 to-green-600 text-white hover:from-green-600 hover:to-green-700 rounded-button font-medium shadow-lg hover:shadow-xl transition-all duration-200">开始同步</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/env.js"></script>
    <script>
    // 设置全局API配置
    window.API_BASE_URL = API_BASE_URL;
    </script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/video-management.js"></script>
</body>
</html>
