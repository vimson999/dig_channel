<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日研报 Top10 编排台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div id="nav-container"></div>

    <main class="mx-auto max-w-[1440px] px-6 py-6">
        <div class="mb-5 flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight">今日研报 Top10 编排台</h1>
                <p class="mt-1 text-sm text-slate-500">选择 10 份已同步 PDF，复用或生成单篇文案，再交给总编辑 Gem 编成一期栏目稿。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="provider-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">配置检查中</span>
                <button id="refresh-status-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-1.5"></i>刷新状态
                </button>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"></div>

        <section class="grid grid-cols-1 gap-5 xl:grid-cols-[480px_minmax(0,1fr)]">
            <aside class="space-y-4">
                <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-base font-black">选择 10 份 PDF</h2>
                        <span id="selected-count" class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-black text-slate-600">0 / 10</span>
                    </div>

                    <div id="asset-tabs" class="mt-4 grid grid-cols-2 gap-2 text-xs font-bold">
                        <button type="button" data-asset-scope="all" class="rounded-md border px-3 py-2 transition">全部 PDF</button>
                        <button type="button" data-asset-scope="hot" class="rounded-md border px-3 py-2 transition">热门 PDF（下载 ≥30）</button>
                    </div>

                    <div class="mt-3 flex gap-2">
                        <input id="asset-search" type="search" class="min-w-0 flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" placeholder="搜索 PDF / 主题">
                        <button id="asset-refresh-btn" type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                            <i class="fas fa-rotate mr-1"></i>刷新
                        </button>
                    </div>
                    <div id="asset-summary" class="mt-2 text-xs text-slate-500">等待加载已同步 PDF。</div>
                    <div id="asset-list" class="mt-2 max-h-[34rem] space-y-2 overflow-auto"></div>
                    <div id="asset-pagination" class="mt-2"></div>

                    <div class="mt-5 border-t border-slate-100 pt-4">
                        <h3 class="text-sm font-black text-slate-800">已选 PDF</h3>
                        <div id="selected-list" class="mt-2 max-h-72 space-y-2 overflow-auto"></div>
                    </div>
                </div>

                <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <h2 class="text-base font-black">编排参数</h2>
                    <div class="mt-4 grid grid-cols-2 gap-3">
                        <label class="block">
                            <span class="mb-1 block text-xs font-bold text-slate-500">栏目名</span>
                            <input id="program-name" type="text" value="今日研报 Top10" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
                        </label>
                        <label class="block">
                            <span class="mb-1 block text-xs font-bold text-slate-500">日期</span>
                            <input id="date-label" type="text" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
                        </label>
                    </div>
                    <label class="mt-3 block">
                        <span class="mb-1 block text-xs font-bold text-slate-500">总编辑 Gem URL</span>
                        <input id="editor-gemini-url" type="url" value="https://gemini.google.com/gem/3d1eca63c142" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
                    </label>
                    <label class="mt-3 flex items-center gap-2 rounded-md border border-emerald-100 bg-emerald-50/70 px-3 py-2 text-xs font-bold text-emerald-800">
                        <input id="reuse-cache" type="checkbox" class="h-4 w-4 rounded border-emerald-300 text-emerald-700" checked>
                        优先复用已持久化的单篇文案缓存
                    </label>
                    <div class="mt-4 grid grid-cols-2 gap-2">
                        <button id="submit-btn" class="rounded-md bg-slate-900 px-3 py-2.5 text-sm font-bold text-white hover:bg-slate-800">
                            <i class="fas fa-paper-plane mr-1.5"></i>开始编排
                        </button>
                        <button id="load-history-btn" class="rounded-md border border-slate-300 px-3 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">
                            <i class="fas fa-clock-rotate-left mr-1.5"></i>加载历史
                        </button>
                    </div>
                </div>
            </aside>

            <section class="min-w-0 rounded-lg border border-slate-200 bg-white shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
                    <div>
                        <h2 class="text-base font-black">编排结果</h2>
                        <p id="summary-text" class="mt-1 text-xs text-slate-500">等待投递。</p>
                    </div>
                    <div class="flex flex-wrap items-center justify-end gap-2 text-xs">
                        <label for="job-name-search" class="sr-only">按名称搜索</label>
                        <div class="relative">
                            <i class="fas fa-magnifying-glass pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="job-name-search" type="search" class="h-9 w-64 rounded-md border border-slate-200 bg-white pl-8 pr-3 text-xs font-bold text-slate-700 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none" placeholder="按名称 / PDF / 主题搜索">
                        </div>
                        <label for="job-status-filter" class="font-bold text-slate-500">状态</label>
                        <select id="job-status-filter" class="h-9 rounded-md border border-slate-200 bg-white px-2.5 text-xs font-bold text-slate-700 focus:border-slate-500 focus:outline-none">
                            <option value="">全部</option>
                            <option value="queued">排队中</option>
                            <option value="running">运行中</option>
                            <option value="succeeded">成功</option>
                            <option value="failed">失败</option>
                            <option value="canceled">已取消</option>
                        </select>
                    </div>
                </div>
                <div id="job-list" class="space-y-3 p-4"></div>
                <div id="job-pagination" class="border-t border-slate-100 px-4 py-3"></div>
            </section>
        </section>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20260624-report-top10"></script>
    <script src="js/report-top10-workflow-test.js?v=20260624-top10-light-detail-api"></script>
</body>
</html>
