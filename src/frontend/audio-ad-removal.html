<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>讲课音频去广告 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto max-w-6xl space-y-6 px-5 py-8">
    <header>
        <p class="mb-2 text-sm font-medium text-indigo-700">工具箱 / 音频处理</p>
        <h1 class="text-2xl font-bold">讲课音频去广告</h1>
        <p class="mt-2 text-sm text-slate-500">查找重复广告或手动标记，试听确认后导出去广告的 MP3。</p>
    </header>
    <p id="status" role="status" aria-live="polite" class="empty:hidden rounded-lg border border-indigo-100 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></p>
    <div class="grid items-start gap-6 lg:grid-cols-[340px_minmax(0,1fr)]">
        <aside class="space-y-5 rounded-2xl border border-slate-200 bg-white p-6">
            <section class="space-y-3">
                <h2 class="font-bold">讲课音频</h2>
                <label class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-200 p-4 text-center hover:border-indigo-400">
                    <i class="fas fa-file-audio mb-2 text-2xl text-indigo-500" aria-hidden="true"></i>
                    <span class="block text-sm font-semibold">选择讲课音频</span>
                    <input id="audio-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.aac" class="mt-3 block w-full text-xs text-slate-600 file:mr-2 file:rounded-md file:border-0 file:bg-indigo-50 file:px-2 file:py-1.5 file:text-indigo-700">
                </label>
                <button id="upload" type="button" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50">上传音频</button>
            </section>
            <section class="space-y-3 border-t border-slate-100 pt-5">
                <h2 class="font-bold">广告样本</h2>
                <div class="rounded-lg border border-slate-200 bg-slate-50 p-3">
                    <p class="text-sm font-medium" id="sample-label">默认样本</p>
                    <p class="mt-1 text-xs text-slate-500" id="sample-status" role="status">正在加载默认样本…</p>
                    <audio id="sample-player" controls preload="metadata" class="mt-2 h-10 w-full" aria-label="试听当前广告样本"></audio>
                </div>
                <label class="block text-xs font-medium text-slate-600">替换样本（可选）
                    <input id="sample" type="file" accept="audio/*,.m4a,.mp3,.wav" class="mt-2 block w-full text-xs file:mr-2 file:rounded-md file:border-0 file:bg-indigo-50 file:px-2 file:py-1.5 file:text-indigo-700">
                </label>
                <button id="reset-sample" type="button" hidden class="text-xs font-semibold text-indigo-700">恢复默认样本</button>
                <label class="flex items-center justify-between gap-2 text-sm text-slate-600">匹配阈值
                    <input id="threshold" type="number" min="0.1" max="0.99" step="0.01" value="0.55" class="w-24 rounded-lg border border-slate-200 px-2 py-1.5 text-sm">
                </label>
                <button id="detect" type="button" disabled class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50">查找广告</button>
            </section>
        </aside>
        <section class="min-w-0 space-y-5 rounded-2xl border border-slate-200 bg-white p-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div><h2 class="text-lg font-bold">试听与标记</h2><p class="mt-1 text-sm text-slate-500">只有确认的区间会从导出音频中剪除。</p></div>
                <button id="export" type="button" disabled class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50"><i class="fas fa-download mr-1" aria-hidden="true"></i> 导出 MP3</button>
            </div>
            <p id="audio-placeholder" class="rounded-lg border border-dashed border-slate-200 bg-slate-50 p-5 text-center text-sm text-slate-500">上传讲课音频后，可以试听并标记广告区间。</p>
            <div id="editor" hidden>
                <audio id="player" controls class="w-full" aria-label="试听讲课音频"></audio>
                <div id="timeline" class="relative mt-3 h-4 cursor-crosshair touch-none overflow-hidden rounded bg-slate-100" title="拖动标记起止时间"></div>
                <p class="mt-2 text-xs text-slate-500">在时间轴上拖动选区，或输入起止秒数。</p>
                <div class="mt-3 flex flex-wrap items-end gap-3">
                    <label class="text-xs text-slate-600">开始（秒）<input id="start" type="number" min="0" step="0.01" class="mt-1 block w-28 rounded-lg border border-slate-200 px-2 py-1.5 text-sm"></label>
                    <label class="text-xs text-slate-600">结束（秒）<input id="end" type="number" min="0" step="0.01" class="mt-1 block w-28 rounded-lg border border-slate-200 px-2 py-1.5 text-sm"></label>
                    <button id="add" type="button" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium hover:bg-slate-50">添加标记</button>
                </div>
            </div>
            <div class="border-t border-slate-100 pt-4">
                <h3 class="mb-3 text-sm font-semibold">广告区间</h3>
                <div id="ranges" class="space-y-2 text-sm text-slate-500">暂无标记</div>
            </div>
        </section>
    </div>
</main>
<script src="js/env.js"></script>
<script src="js/shared-navigation.js?v=20261004-navigation-2"></script>
<script src="js/audio-ad-removal.js?v=20261110-3"></script>
</body>
</html>
