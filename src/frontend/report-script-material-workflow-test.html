<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研报基础文案物料台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div id="nav-container"></div>

    <main class="mx-auto max-w-[1440px] px-6 py-6">
        <div class="mb-5 flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight">研报基础文案物料台</h1>
                <p class="mt-1 text-sm text-slate-500">选择已同步 PDF，投递到独立物料队列，生成可复用的单篇口播文案。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="provider-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">配置检查中</span>
                <span id="worker-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">Worker 检查中</span>
                <button id="refresh-status-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-1.5"></i>刷新状态
                </button>
                <button id="restart-worker-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-bolt mr-1.5"></i>重启队列
                </button>
                <a href="celery-monitor.html" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-chart-line mr-1.5"></i>Monitor
                </a>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"></div>

        <section class="grid grid-cols-1 gap-5 xl:grid-cols-[520px_minmax(0,1fr)]">
            <aside class="space-y-4">
                <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-base font-black">投递 PDF</h2>
                        <span id="selected-count" class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-black text-slate-600">0 份</span>
                    </div>
                    <div id="pdf-source-tabs" class="mt-4 grid grid-cols-2 gap-2 text-xs font-bold">
                        <button type="button" disabled class="rounded-md border border-slate-200 bg-white px-3 py-2 text-slate-500 opacity-70">
                            <i class="far fa-circle mr-2"></i>上传 PDF
                        </button>
                        <button type="button" class="rounded-md border border-slate-200 bg-white px-3 py-2 text-slate-700">
                            <i class="fas fa-dot-circle mr-2 text-blue-600"></i>选择已同步 PDF
                        </button>
                    </div>
                    <div id="asset-tabs" class="mt-3 grid grid-cols-2 gap-2 text-xs font-bold">
                        <button type="button" data-asset-scope="all" class="rounded-md border px-3 py-2 transition">全部 PDF</button>
                        <button type="button" data-asset-scope="hot" class="rounded-md border px-3 py-2 transition">热门 PDF（下载 ≥40）</button>
                    </div>
                    <div class="mt-3 flex gap-2">
                        <input id="asset-search" type="search" class="min-w-0 flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" placeholder="搜索 PDF / 主题">
                        <button id="asset-refresh-btn" type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                            <i class="fas fa-rotate mr-1"></i>刷新
                        </button>
                    </div>
                    <div id="asset-summary" class="mt-2 text-xs text-slate-500">等待加载已同步 PDF。</div>
                    <div id="asset-list" class="mt-2 max-h-[34rem] space-y-2 overflow-auto"></div>
                    <div id="asset-pagination" class="mt-2"></div>
                </div>

                <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-base font-black">投递参数</h2>
                        <button id="clear-selected-btn" class="rounded-md border border-slate-200 px-2.5 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-50">
                            <i class="fas fa-xmark mr-1"></i>清空
                        </button>
                    </div>
                    <div id="selected-list" class="mt-3 max-h-56 space-y-2 overflow-auto"></div>
                    <label class="mt-4 block">
                        <span class="mb-1 block text-xs font-bold text-slate-500">单篇 Gem URL</span>
                        <select id="gemini-url-select" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-700 focus:border-slate-500 focus:outline-none"></select>
                        <input id="gemini-url" type="url" class="mt-2 hidden w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" placeholder="粘贴 https://gemini.google.com/gem/...">
                        <div id="gemini-url-current" class="mt-1 truncate text-[11px] font-bold text-slate-400"></div>
                    </label>
                    <details class="mt-3 rounded-md border border-slate-200 bg-slate-50">
                        <summary class="cursor-pointer px-3 py-2 text-xs font-black text-slate-700">提示词</summary>
                        <div class="space-y-3 p-3">
                            <label class="block">
                                <span class="mb-1 block text-xs font-bold text-slate-500">首轮提示词</span>
                                <textarea id="prompt" rows="3" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm leading-6 focus:border-slate-500 focus:outline-none">请解析上传的研报 PDF，提取核心观点、关键数据、风险提示和可用于口播的摘要。</textarea>
                            </label>
                            <label class="block">
                                <span class="mb-1 block text-xs font-bold text-slate-500">自审追问</span>
                                <textarea id="review-prompt" rows="4" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm leading-6 focus:border-slate-500 focus:outline-none">担任首席责任主编，利用提供的PDF材料和可查网络信息，对上文内容逐条复核与勘误，确认事实准确、逻辑清晰、表达规范，列出每条修正点及依据，并给出最终优化后的信息版本，附上核对过程说明和参考来源。</textarea>
                            </label>
                        </div>
                    </details>
                    <button id="submit-btn" class="mt-4 w-full rounded-md bg-slate-900 px-3 py-2.5 text-sm font-bold text-white hover:bg-slate-800">
                        <i class="fas fa-paper-plane mr-1.5"></i>投递基础文案物料任务
                    </button>
                </div>
            </aside>

            <section class="min-w-0 rounded-lg border border-slate-200 bg-white shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
                    <div>
                        <h2 class="text-base font-black">任务历史</h2>
                        <p id="summary-text" class="mt-1 text-xs text-slate-500">等待投递。</p>
                    </div>
                    <div class="flex flex-wrap items-center justify-end gap-2 text-xs">
                        <div class="relative">
                            <i class="fas fa-magnifying-glass pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="job-search" type="search" class="h-9 w-64 rounded-md border border-slate-200 bg-white pl-8 pr-3 text-xs font-bold text-slate-700 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none" placeholder="按名称 / PDF / 主题搜索">
                        </div>
                        <label for="job-date-filter" class="font-bold text-slate-500">投递日期</label>
                        <input id="job-date-filter" type="date" class="h-9 rounded-md border border-slate-200 bg-white px-2.5 text-xs font-bold text-slate-700 focus:border-slate-500 focus:outline-none">
                        <label for="job-status-filter" class="font-bold text-slate-500">状态</label>
                        <select id="job-status-filter" class="h-9 rounded-md border border-slate-200 bg-white px-2.5 text-xs font-bold text-slate-700 focus:border-slate-500 focus:outline-none">
                            <option value="">全部</option>
                            <option value="queued">排队中</option>
                            <option value="running">运行中</option>
                            <option value="succeeded">成功</option>
                            <option value="failed">失败</option>
                            <option value="canceled">已取消</option>
                        </select>
                        <button id="load-history-btn" class="h-9 rounded-md border border-slate-300 px-3 text-xs font-bold text-slate-700 hover:bg-slate-50">
                            <i class="fas fa-rotate mr-1"></i>刷新
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,0.95fr)_minmax(420px,1.05fr)]">
                    <div>
                        <div id="job-list" class="space-y-3 p-4"></div>
                        <div id="job-pagination" class="border-t border-slate-100 px-4 py-3"></div>
                    </div>
                    <div id="job-detail" class="border-t border-slate-200 bg-slate-50 p-4 xl:border-l xl:border-t-0"></div>
                </div>
            </section>
        </section>
    </main>

    <div id="storyboard-raw-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4 backdrop-blur-sm [&:not(.hidden)]:flex">
        <section class="flex max-h-[90vh] w-full max-w-5xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
            <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4">
                <div class="min-w-0">
                    <h2 class="text-base font-black text-slate-900">Gem 原始返回值</h2>
                    <p id="storyboard-raw-meta" class="mt-1 truncate text-xs text-slate-500"></p>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                    <button id="storyboard-raw-copy" type="button" class="rounded-md border border-slate-200 px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                        <i class="fas fa-copy mr-1"></i>复制原文
                    </button>
                    <button data-storyboard-raw-close type="button" class="rounded-md border border-slate-200 px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                        <i class="fas fa-xmark mr-1"></i>关闭
                    </button>
                </div>
            </header>
            <div class="min-h-0 flex-1 overflow-auto bg-slate-950 p-5">
                <pre id="storyboard-raw-content" class="whitespace-pre-wrap break-words text-sm leading-7 text-slate-100"></pre>
            </div>
        </section>
    </div>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20260721-banner-footer-fix"></script>
    <script src="js/download-count-highlight.js?v=20260702"></script>
    <script src="js/visibility-polling.js?v=20260820-report-material-hidden-polling"></script>
    <script src="js/report-script-material-workflow-test.js?v=20260820-report-material-hidden-polling"></script>
</body>
</html>
