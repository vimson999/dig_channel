<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量音频转文案 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
        .status-waiting { background: #f1f5f9; color: #64748b; }
        .status-processing { background: #dbeafe; color: #1d4ed8; }
        .status-success { background: #dcfce7; color: #15803d; }
        .status-failed { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <!-- 导航由 shared-navigation.js 统一管理 -->

    <div class="max-w-[1440px] mx-auto px-6 py-4">
        <nav class="flex items-center gap-2 text-sm text-slate-500">
            <a href="/" class="hover:text-blue-600 transition-colors"><i class="fas fa-home"></i></a>
            <span>/</span>
            <span class="text-slate-700">批量音频转文案</span>
        </nav>
    </div>

    <main class="max-w-[1440px] mx-auto px-6 pb-10">
        <div class="grid grid-cols-1 xl:grid-cols-[420px_1fr] gap-6">
            <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-100">
                    <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center mb-4">
                        <i class="fas fa-file-audio text-blue-600 text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-900">本地批量转写</h1>
                    <p class="text-sm text-slate-500 mt-2">递归扫描音频目录，使用本机 MLX-Whisper 生成带时间戳的 TXT 文案。</p>
                </div>

                <form id="batch-form" class="p-6 space-y-5">
                    <div>
                        <label for="input-dir" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">音频输入目录</label>
                        <div class="flex gap-2">
                            <input id="input-dir" type="text" class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="/Users/v9/Downloads/audio-input">
                            <button type="button" id="pick-input-dir" class="shrink-0 rounded-lg border border-slate-300 px-3 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 transition-colors" title="选择音频输入目录">
                                <i class="fas fa-folder-open"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="output-dir" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">文案输出目录</label>
                        <div class="flex gap-2">
                            <input id="output-dir" type="text" class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="/Users/v9/Downloads/audio-text">
                            <button type="button" id="pick-output-dir" class="shrink-0 rounded-lg border border-slate-300 px-3 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 transition-colors" title="选择文案输出目录">
                                <i class="fas fa-folder-open"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="model-size" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">识别模型</label>
                        <select id="model-size" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                            <option value="large-v3">mlx-community/whisper-large-v3-mlx-8bit</option>
                            <option value="medium" selected>mlx-community/whisper-medium-mlx-8bit</option>
                            <option value="small">mlx-community/whisper-small-mlx-8bit</option>
                            <option value="base">mlx-community/whisper-base-mlx-8bit</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="scan-btn" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 transition-colors">
                            <i class="fas fa-search mr-2"></i>扫描音频
                        </button>
                        <button type="submit" id="start-btn" class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            <i class="fas fa-play mr-2"></i>开始转写
                        </button>
                    </div>
                </form>

                <div class="px-6 pb-6">
                    <div class="rounded-xl bg-slate-50 border border-slate-200 p-4">
                        <div class="text-xs font-bold text-slate-500 mb-2">输出格式</div>
                        <pre class="text-xs leading-6 text-slate-600 whitespace-pre-wrap">00:00

本音频为知识星球前沿信息收录内部学习资料，禁止外传。更多投研资料请加微信，FCCNN八八。

00:10

情况下呢，呃这个量价提升啊，同时相关的上市公司表现的股价也也很好啊。</pre>
                    </div>
                </div>
            </section>

            <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden min-h-[640px]">
                <div class="p-6 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-extrabold text-slate-900">处理队列</h2>
                        <p id="summary-text" class="text-sm text-slate-500 mt-1">等待扫描音频目录</p>
                    </div>
                    <div class="min-w-[260px]">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-2">
                            <span id="task-state">未开始</span>
                            <span id="progress-label">0 / 0</span>
                        </div>
                        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-blue-600 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div id="alert" class="hidden mx-6 mt-6 rounded-lg border px-4 py-3 text-sm"></div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr class="text-left text-xs font-extrabold uppercase tracking-wide text-slate-500">
                                <th class="px-6 py-3 w-16">#</th>
                                <th class="px-6 py-3">音频文件</th>
                                <th class="px-6 py-3 w-28">音频时长</th>
                                <th class="px-6 py-3 w-28">处理耗时</th>
                                <th class="px-6 py-3">输出 TXT</th>
                                <th class="px-6 py-3 w-36">状态</th>
                            </tr>
                        </thead>
                        <tbody id="file-table" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="4" class="px-6 py-16 text-center text-slate-400">
                                    <i class="fas fa-folder-open text-3xl mb-3 block"></i>
                                    输入目录后先扫描，队列会显示在这里
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js"></script>
    <script src="js/batch-transcription.js"></script>
</body>
</html>
