<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材下载中心 - Shioa 智能数据分析平台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-blur: 8px; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .input-field { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.875rem; transition: all 0.2s; background: #fff; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 0.75rem 2rem; border-radius: 12px; font-weight: 600; transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); }
        .progress-bar-fill { transition: width 0.5s ease-out; }
        .type-option input:checked + span { background: #eff6ff; border-color: #3b82f6; color: #2563eb; box-shadow: 0 0 0 1px #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <main class="max-w-[1200px] mx-auto px-6 py-12">
        <div class="mb-12">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">素材下载中心</h2>
            <p class="text-slate-500 mt-2">粘贴视频地址，可下载视频、音频、SRT 字幕或纯文本</p>
        </div>

        <!-- Download Input -->
        <div class="glass-card mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="videoUrl" class="input-field" placeholder="粘贴视频地址 (YouTube, Bilibili, etc.)...">
                </div>
                <button id="downloadBtn" class="btn-primary">
                    <i class="fas fa-download mr-2"></i> 开始下载
                </button>
            </div>
            <div class="mt-4 flex flex-wrap items-center gap-2" role="radiogroup" aria-label="下载内容">
                <span class="text-sm font-semibold text-slate-600 mr-1">下载内容</span>
                <label class="type-option cursor-pointer"><input class="sr-only" type="radio" name="downloadType" value="video" checked><span class="inline-flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600"><i class="fas fa-video"></i>视频 <em class="not-italic text-[10px] text-blue-500">默认</em></span></label>
                <label class="type-option cursor-pointer"><input class="sr-only" type="radio" name="downloadType" value="audio"><span class="inline-flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600"><i class="fas fa-headphones"></i>仅音频</span></label>
                <label class="type-option cursor-pointer"><input class="sr-only" type="radio" name="downloadType" value="srt"><span class="inline-flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600"><i class="fas fa-closed-captioning"></i>SRT 字幕</span></label>
                <label class="type-option cursor-pointer"><input class="sr-only" type="radio" name="downloadType" value="text"><span class="inline-flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600"><i class="fas fa-file-lines"></i>纯文本 TXT</span></label>
            </div>
        </div>

        <!-- Task List -->
        <div class="space-y-4" id="taskList">
            <!-- Tasks will be injected here -->
            <div class="text-center py-20 text-slate-400">
                <i class="fas fa-cloud-download-alt text-5xl mb-4 block"></i>
                <p>暂无下载任务</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/shared-navigation.js"></script>
    <script>
        const API_BASE = 'http://localhost:5001/api/v1';
        let tasks = [];
        const typeLabels = { video: '视频', audio: '音频', srt: 'SRT 字幕', text: 'TXT 文本' };

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE}/downloader/tasks`);
                const json = await res.json();
                if (json.success) {
                    tasks = json.data;
                    renderTasks();
                }
            } catch (e) { console.error('Failed to load tasks', e); }
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            if (tasks.length === 0) return;

            list.innerHTML = tasks.map(task => {
                const isDownloading = task.status === 'downloading';
                const isCompleted = task.status === 'completed';
                const isFailed = task.status === 'failed';
                const isCancelled = task.status === 'cancelled';
                const isActive = ['pending', 'downloading', 'processing'].includes(task.status);
                
                let statusBadge = '';
                if (isDownloading) statusBadge = '<span class="px-2 py-1 bg-blue-100 text-blue-600 text-xs font-bold rounded">下载中</span>';
                if (isCompleted) statusBadge = '<span class="px-2 py-1 bg-emerald-100 text-emerald-600 text-xs font-bold rounded">已完成</span>';
                if (isFailed) statusBadge = '<span class="px-2 py-1 bg-red-100 text-red-600 text-xs font-bold rounded">失败</span>';
                if (isCancelled) statusBadge = '<span class="px-2 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded">已停止</span>';
                if (task.status === 'pending') statusBadge = '<span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded">等待中</span>';

                return `
                <div class="glass-card flex gap-6 items-center">
                    <div class="w-40 h-24 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 shadow-sm">
                        ${task.thumbnail ? `<img src="${task.thumbnail}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-slate-400"><i class="fas fa-video text-2xl"></i></div>'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-slate-800 truncate pr-4" title="${task.title}">${task.title || task.url}</h3>
                            <div class="flex items-center gap-2"><span class="px-2 py-1 bg-violet-50 text-violet-600 text-xs font-bold rounded">${typeLabels[task.download_type || 'video'] || '视频'}</span>${statusBadge}</div>
                        </div>
                        <p class="text-xs text-slate-400 mb-4 truncate">${task.url}</p>
                        
                        ${isDownloading ? `
                        <div class="space-y-2">
                            <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                <div class="bg-blue-500 h-full progress-bar-fill" style="width: ${task.progress}%"></div>
                            </div>
                            <div class="flex justify-between text-[10px] font-medium text-blue-500">
                                <span>进度: ${task.progress.toFixed(1)}%</span>
                                <span>正在保存到本地...</span>
                            </div>
                        </div>
                        ` : ''}

                        ${isCompleted ? `
                        <div class="flex items-center gap-4 text-xs text-slate-500">
                            <span><i class="far fa-file mr-1"></i> ${task.filename}</span>
                            <span><i class="far fa-hdd mr-1"></i> ${(task.file_size / (1024*1024)).toFixed(1)} MB</span>
                            <span class="text-emerald-500"><i class="fas fa-check-circle mr-1"></i> 下载成功</span>
                        </div>
                        ` : ''}

                        ${isFailed ? `
                        <div class="text-xs text-red-500 font-medium">
                            <i class="fas fa-exclamation-triangle mr-1"></i> 错误: ${task.error_message}
                        </div>
                        ` : ''}
                    </div>
                    <div class="flex gap-2">
                        ${isActive ? `
                        <button onclick="cancelTask('${task.id}')" class="p-2 text-slate-400 hover:text-amber-600 transition-colors" title="停止任务">
                            <i class="fas fa-stop-circle"></i>
                        </button>
                        ` : ''}
                        ${isCompleted ? `
                        <button onclick="copyPath('${task.filepath}')" class="p-2 text-slate-400 hover:text-blue-500 transition-colors" title="复制路径">
                            <i class="fas fa-copy"></i>
                        </button>
                        ` : ''}
                        <button onclick="deleteTask('${task.id}')" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function submitDownload() {
            const urlInput = document.getElementById('videoUrl');
            const url = urlInput.value.trim();
            if (!url) return;
            const downloadType = document.querySelector('input[name="downloadType"]:checked').value;

            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 提交中...';

            try {
                const res = await fetch(`${API_BASE}/downloader/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, download_type: downloadType })
                });
                const json = await res.json();
                if (json.success) {
                    urlInput.value = '';
                    loadTasks();
                } else {
                    alert('提交失败: ' + json.error);
                }
            } catch (e) {
                alert('网络错误');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-download mr-2"></i> 开始下载';
            }
        }

        async function deleteTask(id) {
            if (!confirm('确定删除此记录吗？')) return;
            try {
                const res = await fetch(`${API_BASE}/downloader/task/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) loadTasks();
            } catch (e) { console.error(e); }
        }

        async function cancelTask(id) {
            try {
                const res = await fetch(`${API_BASE}/downloader/task/${id}/cancel`, { method: 'POST' });
                const json = await res.json();
                if (json.success) loadTasks();
                else alert('停止失败: ' + json.error);
            } catch (e) { alert('网络错误'); }
        }

        function copyPath(path) {
            navigator.clipboard.writeText(path);
            alert('文件路径已复制到剪贴板');
        }

        document.getElementById('downloadBtn').addEventListener('click', submitDownload);
        document.getElementById('videoUrl').addEventListener('keypress', e => { if (e.key === 'Enter') submitDownload(); });

        // Polling
        setInterval(loadTasks, 3000);
        loadTasks();
    </script>
</body>
</html>
