<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研报视觉编排测试台 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div id="nav-container"></div>

    <main class="mx-auto max-w-[1440px] px-6 py-6">
        <div class="mb-5 flex flex-col gap-3 xl:flex-row xl:items-end xl:justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight">研报视觉编排测试台</h1>
                <p class="mt-1 text-sm text-slate-500">使用已有基础文案生成 visual_plan，并预览开场封面与逻辑图解卡。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="provider-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-500">DS 检查中</span>
                <a href="report-script-material-workflow-test.html" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-file-lines mr-1.5"></i>基础文案台
                </a>
                <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                    <i class="fas fa-rotate mr-1.5"></i>刷新
                </button>
            </div>
        </div>

        <div id="notice" class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"></div>

        <section class="grid grid-cols-1 gap-5 xl:grid-cols-[520px_minmax(0,1fr)]">
            <aside class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-base font-black">选择 PDF</h2>
                    <label class="inline-flex items-center gap-2 rounded-md bg-slate-50 px-2.5 py-1.5 text-xs font-bold text-slate-600">
                        <input id="force-refresh" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-slate-900">
                        强制重跑 DS
                    </label>
                </div>
                <div id="asset-tabs" class="mt-4 grid grid-cols-2 gap-2 text-xs font-bold">
                    <button type="button" data-asset-scope="all" class="rounded-md border px-3 py-2 transition">全部 PDF</button>
                    <button type="button" data-asset-scope="hot" class="rounded-md border px-3 py-2 transition">热门 PDF（下载 ≥40）</button>
                </div>
                <div class="mt-3 flex gap-2">
                    <input id="asset-search" type="search" class="min-w-0 flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" placeholder="搜索 PDF / 主题">
                    <button id="asset-refresh-btn" type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50">
                        <i class="fas fa-rotate mr-1"></i>刷新
                    </button>
                </div>
                <div id="asset-summary" class="mt-2 text-xs text-slate-500">等待加载已同步 PDF。</div>
                <div id="asset-list" class="mt-2 max-h-[46rem] space-y-2 overflow-auto"></div>
                <div id="asset-pagination" class="mt-3"></div>
            </aside>

            <section class="min-w-0 rounded-lg border border-slate-200 bg-white shadow-sm">
                <div class="flex items-center justify-between gap-3 border-b border-slate-200 px-4 py-3">
                    <div>
                        <h2 class="text-base font-black">visual_plan 预览</h2>
                        <p id="preview-summary" class="mt-1 text-xs text-slate-500">选择一份已有基础文案的 PDF 后生成。</p>
                    </div>
                    <span id="preview-badge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-500">未生成</span>
                </div>
                <div id="preview-panel" class="p-4">
                    <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-8 text-center text-sm font-bold text-slate-400">
                        等待生成 visual_plan。
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20260627-visual-plan"></script>
    <script src="js/download-count-highlight.js?v=20260702"></script>
    <script src="js/report-visual-plan-test.js?v=20260702-download-count-highlight"></script>
</body>
</html>
