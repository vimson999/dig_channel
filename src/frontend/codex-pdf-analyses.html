<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Codex PDF 分析归档 - Shioa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/codex-pdf-analyses.css?v=20261110-2">
</head>
<body class="codex-pdf-archive-page">
    <main class="archive-shell">
        <header class="archive-hero">
            <div>
                <span class="archive-kicker"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Codex · PDF 分析归档</span>
                <h1>分析报告</h1>
                <p>这里仅查看 Codex 完成并保存的报告。分析过程由 Codex 执行，本页面只读取已持久化结果。</p>
            </div>
            <div class="archive-hero-mark" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></div>
        </header>

        <div id="archive-status" class="archive-status" role="status" aria-live="polite"></div>

        <div class="archive-layout">
            <aside class="history-panel" aria-labelledby="history-heading">
                <div class="panel-heading">
                    <div><span class="eyebrow">历史记录</span><h2 id="history-heading">分析批次</h2></div>
                    <span id="history-count" class="count-pill">0</span>
                </div>
                <div id="history-list" class="history-list" aria-live="polite">
                    <div class="empty-state">正在读取历史…</div>
                </div>
                <div class="history-pagination">
                    <button id="history-prev" type="button" aria-label="上一页" disabled><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="history-page-label">第 1 页</span>
                    <button id="history-next" type="button" aria-label="下一页" disabled><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </aside>

            <section class="report-panel" aria-labelledby="report-heading">
                <div id="report-empty" class="report-empty">
                    <div class="empty-icon"><i class="fa-regular fa-file-lines"></i></div>
                    <h2 id="report-heading">选择一份分析报告</h2>
                    <p>每份报告保留独立版本和 PDF 证据引用。</p>
                </div>
                <div id="report-content" hidden></div>
            </section>
        </div>
    </main>

    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/shared-navigation.js?v=20261110-codex-pdf"></script>
    <script src="js/codex-pdf-analyses.js?v=20261110-1"></script>
</body>
</html>
