<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包语音 V3 - Shioa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div id="nav-container"></div>

    <main class="max-w-[1440px] mx-auto px-6 py-6">
        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                        <i class="fas fa-wave-square"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">豆包语音 WebSocket V3</h1>
                        <p class="text-sm text-slate-500">文本转语音，支持音色、语速、音量和字幕时间戳。</p>
                    </div>
                </div>
                <span id="provider-status" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">检查配置中</span>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-[420px_minmax(0,1fr)]">
                <aside class="border-r border-slate-100 p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">任务标题</label>
                        <input id="task-title" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：最新市场观点配音">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">资源模型</label>
                            <select id="resource-id" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="seed-tts-2.0">seed-tts-2.0</option>
                                <option value="seed-tts-1.0">seed-tts-1.0</option>
                                <option value="seed-icl-2.0">seed-icl-2.0</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">表现模型</label>
                            <select id="model" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="seed-tts-2.0-standard">standard</option>
                                <option value="seed-tts-2.0-expressive">expressive</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">预置音色</label>
                            <select id="voice-preset" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="zh_female_mizai_uranus_bigtts">黑猫 / zh_female_mizai_uranus_bigtts</option>
                                <option value="zh_female_qingchezizi_uranus_bigtts">清澈 / zh_female_qingchezizi_uranus_bigtts</option>
                                <option value="zh_male_liufei_uranus_bigtts">刘飞 / zh_male_liufei_uranus_bigtts</option>
                                <option value="zh_male_dayi_uranus_bigtts">大台 / zh_male_dayi_uranus_bigtts</option>
                                <option value="custom">手动填写其他音色 ID</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">音色 ID</label>
                            <input id="voice-type" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg" value="zh_female_mizai_uranus_bigtts">
                            <p class="mt-1 text-xs text-slate-400">选择预置音色会自动填入，也可手动改成控制台里的音色 ID。</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">格式</label>
                            <select id="audio-format" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="mp3">mp3</option>
                                <option value="ogg_opus">ogg_opus</option>
                                <option value="pcm">pcm</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">采样率</label>
                            <select id="sample-rate" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="24000">24000</option>
                                <option value="32000">32000</option>
                                <option value="44100">44100</option>
                                <option value="48000">48000</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">码率</label>
                            <select id="bit-rate" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="128000">128k</option>
                                <option value="96000">96k</option>
                                <option value="64000">64k</option>
                                <option value="160000">160k</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">语速 <span id="speed-label" class="text-blue-600">1.0x</span></label>
                            <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" class="w-full">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">音量 <span id="loudness-label" class="text-blue-600">1.0x</span></label>
                            <input id="loudness" type="range" min="0.5" max="2" step="0.1" value="1" class="w-full">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">情绪</label>
                            <input id="emotion" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg" placeholder="angry / happy，可空">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">情绪值</label>
                            <select id="emotion-scale" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg">
                                <option value="4">4</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>

                    <label class="flex items-center gap-2 text-sm text-slate-700">
                        <input id="enable-subtitle" type="checkbox" checked class="rounded border-slate-300">
                        返回字幕时间戳并生成 SRT
                    </label>

                    <button id="submit-btn" class="w-full h-11 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i>
                        提交合成任务
                    </button>
                    <div id="form-message" class="hidden text-sm rounded-lg px-3 py-2"></div>
                </aside>

                <section class="p-6 space-y-5">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-semibold text-slate-700">合成文本</label>
                            <div class="flex items-center gap-2">
                                <button id="split-btn" class="px-3 py-1.5 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">按空行拆段</button>
                                <span id="char-count" class="text-xs text-slate-400">0 字</span>
                            </div>
                        </div>
                        <textarea id="text-input" rows="12" class="w-full px-4 py-3 border border-slate-200 rounded-xl leading-7 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="把需要配音的文案放在这里。可以用空行分段，系统会串行生成每段音频。"></textarea>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <h2 class="font-bold">任务列表</h2>
                                <p class="text-sm text-slate-500">使用现有 TTS 任务表，刷新后可以查看每段状态和下载音频。</p>
                            </div>
                            <button id="refresh-btn" class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">
                                <i class="fas fa-sync-alt mr-1"></i>刷新
                            </button>
                        </div>
                        <div id="task-list" class="space-y-3"></div>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/40" data-close-detail></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-3xl bg-white shadow-2xl flex flex-col">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 id="detail-title" class="text-lg font-bold">任务详情</h3>
                    <p id="detail-meta" class="text-sm text-slate-500"></p>
                </div>
                <button data-close-detail class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="detail-body" class="p-5 overflow-y-auto space-y-3"></div>
        </div>
    </div>

    <script src="js/env.js"></script>
    <script src="js/shared-navigation.js?v=20261004-navigation-2"></script>
    <script src="js/doubao-tts.js?v=20260521-001"></script>
</body>
</html>
