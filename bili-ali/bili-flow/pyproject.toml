[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bili-flow"
version = "0.1.0"
description = "High-performance Bilibili automation toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bilibili-api-python",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy"
]

[tool.hatch.build.targets.wheel]
packages = ["src/biliflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["biliflow"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
