# YouTube Analytics 服务配置文件
# 放置在: /etc/supervisor/conf.d/youtube_analytics.conf

[program:youtube_analytics_api]
user=ubuntu
directory=/code/bot_app/youtube-analytics
environment=PYTHONPATH="/code/bot_app/youtube-analytics/src/backend",
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
            DATABASE_URL="sqlite:////code/bot_app/youtube-analytics/instance/youtube_tracker.db",
            YOUTUBE_API_KEY="your_youtube_api_key_here",
            SECRET_KEY="your_secret_key_here",
            JWT_SECRET_KEY="your_jwt_secret_key_here",
            LOG_LEVEL="INFO",
            ENVIRONMENT="production"
command=/code/bot_app/youtube-analytics/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8084 --workers 2
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/youtube_analytics_api_stdout.log
stderr_logfile=/var/log/supervisor/youtube_analytics_api_stderr.log
stopsignal=INT

[program:youtube_scheduler]
user=ubuntu
directory=/code/bot_app/youtube-analytics/src/backend
environment=PYTHONPATH="/code/bot_app/youtube-analytics/src/backend",
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
            DATABASE_URL="sqlite:////code/bot_app/youtube-analytics/instance/youtube_tracker.db",
            YOUTUBE_API_KEY="your_youtube_api_key_here",
            SECRET_KEY="your_secret_key_here",
            LOG_LEVEL="INFO",
            ENVIRONMENT="production"
command=/code/bot_app/youtube-analytics/venv/bin/python scheduler/production_scheduler.py
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/youtube_scheduler_stdout.log
stderr_logfile=/var/log/supervisor/youtube_scheduler_stderr.log
stopsignal=INT