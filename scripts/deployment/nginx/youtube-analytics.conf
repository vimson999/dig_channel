# Production edge configuration. Replace the example host and certificate paths.
limit_req_zone $binary_remote_addr zone=login_ip:10m rate=5r/m;

upstream youtube_analytics_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name youtube-analytics.example.com www.youtube-analytics.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name youtube-analytics.example.com www.youtube-analytics.example.com;

    ssl_certificate /etc/letsencrypt/live/youtube-analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtube-analytics.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /path/to/youtube-analytics/src/frontend;
    index index.html;
    client_max_body_size 100M;

    location = /health {
        proxy_pass http://youtube_analytics_backend/health;
        access_log off;
    }

    # The opaque path is checked by Flask against LOGIN_PORTAL_TOKEN.
    location ^~ /access/ {
        limit_req zone=login_ip burst=3 nodelay;
        access_log off;
        proxy_pass http://youtube_analytics_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_ip burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://youtube_analytics_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets needed only to render the private login page.
    location = /js/config.js { try_files $uri =404; }
    location = /js/api.js { try_files $uri =404; }
    location = /js/utils.js { try_files $uri =404; }
    location = /js/env.js { try_files $uri =404; }
    location = /assets/images/favicon.ico { try_files $uri =404; }

    location = /login.html { return 404; }
    location = /login_enhanced.html { return 404; }
    location = /register.html { return 404; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /sitemap.xml { return 404; }

    location = /_auth_check {
        internal;
        proxy_pass http://youtube_analytics_backend/api/v1/auth/session-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /_auth_check;
        error_page 401 403 =404 /__private_not_found;
        proxy_pass http://youtube_analytics_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /__private_not_found { internal; return 404; }

    location / {
        auth_request /_auth_check;
        error_page 401 403 =404 /__private_not_found;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
    location ~* \.(env|log|ini|conf|bak|old|tmp|py|pyc)$ { deny all; }

    access_log /var/log/nginx/youtube-analytics-access.log;
    error_log /var/log/nginx/youtube-analytics-error.log warn;
}
