# YouTube Analytics Nginx配置
# 将此文件复制到 /etc/nginx/sites-available/youtube-analytics
# 然后创建软链接: sudo ln -s /etc/nginx/sites-available/youtube-analytics /etc/nginx/sites-enabled/

# 上游后端服务
upstream youtube_analytics_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP到HTTPS重定向
server {
    listen 80;
    server_name youtube-analytics.example.com www.youtube-analytics.example.com;
    
    # Let's Encrypt验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 其他所有请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS主服务器
server {
    listen 443 ssl http2;
    server_name youtube-analytics.example.com www.youtube-analytics.example.com;

    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/youtube-analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtube-analytics.example.com/privkey.pem;
    
    # SSL安全配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:" always;

    # 前端静态文件目录
    root /path/to/youtube-analytics/src/frontend;
    index index.html;

    # 客户端最大上传大小
    client_max_body_size 10M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/html
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # 缓存配置
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 前端路由处理
    location / {
        try_files $uri $uri/ @fallback;
    }

    # 前端fallback到index.html (SPA路由)
    location @fallback {
        try_files /index.html =404;
    }

    # API代理到后端
    location /api/ {
        proxy_pass http://youtube_analytics_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://youtube_analytics_backend/health;
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    # sitemap.xml
    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
    }

    # 隐藏文件和目录
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~* \.(env|log|ini|conf|bak|old|tmp|py|pyc)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 日志配置
    access_log /var/log/nginx/youtube-analytics-access.log;
    error_log /var/log/nginx/youtube-analytics-error.log;
}