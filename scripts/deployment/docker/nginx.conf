events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    limit_req_zone $binary_remote_addr zone=login_ip:10m rate=5r/m;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    client_max_body_size 100M;

    upstream backend { server youtube-analytics:5000; keepalive 16; }

    server {
        listen 80;
        server_name youtube-analytics.example.com www.youtube-analytics.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name youtube-analytics.example.com www.youtube-analytics.example.com;
        ssl_certificate /etc/ssl/certs/youtube-analytics.crt;
        ssl_certificate_key /etc/ssl/private/youtube-analytics.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        root /var/www/html;
        index index.html;

        location = /health { proxy_pass http://backend/health; access_log off; }

        location ^~ /access/ {
            limit_req zone=login_ip burst=3 nodelay;
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_ip burst=5 nodelay;
            client_max_body_size 16k;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /js/config.js { try_files $uri =404; }
        location = /js/api.js { try_files $uri =404; }
        location = /js/utils.js { try_files $uri =404; }
        location = /js/env.js { try_files $uri =404; }
        location = /assets/images/favicon.ico { try_files $uri =404; }
        location = /login.html { return 404; }
        location = /login_enhanced.html { return 404; }
        location = /register.html { return 404; }
        location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
        location = /sitemap.xml { return 404; }

        location = /_auth_check {
            internal;
            proxy_pass http://backend/api/v1/auth/session-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HMAC-authenticated machine callers do not have an interactive
        # session. The Flask route validates the tenant app-id/signature.
        location = /api/v1/zsxq/browser-import/history {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location = /api/audio-transcriptions/jobs {
            auth_request /_auth_check;
            error_page 401 403 =404 /__private_not_found;
            client_max_body_size 2050M;
            proxy_request_buffering off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            auth_request /_auth_check;
            error_page 401 403 =404 /__private_not_found;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location = /__private_not_found { internal; return 404; }
        location / {
            auth_request /_auth_check;
            error_page 401 403 =404 /__private_not_found;
            try_files $uri $uri/ /index.html;
        }
        location ~ /\. { deny all; }
        location ~* \.(env|log|ini|conf|bak|old|tmp|py|pyc)$ { deny all; }
    }
}
